---
version: 2
updates:
  # Python dependencies - library root (manifests: requirements.txt,
  # requirements-dev.txt, requirements-docker.txt). The legacy
  # /library/backend entry was removed because that directory has no
  # pip manifest — it was producing zero scans and noise in the dashboard.
  - package-ecosystem: "pip"
    directory: "/library"
    schedule:
      interval: "weekly"
      day: "monday"
      timezone: "America/Chicago"
    cooldown:
      default-days: 7
    groups:
      python-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    ignore:
      # radon 6.0.1 caps mando at <0.8. Dependabot bumped mando to
      # >=0.8.2,<0.9 in #132 (2026-08-11); the result is unresolvable and it
      # broke every CI run on main for two weeks before anyone noticed,
      # because auto-merge had no status-check gate at the time. Keep mando
      # out of Dependabot's reach until radon relaxes its ceiling.
      - dependency-name: "mando"
        versions: [">=0.8"]
    labels: ["dependencies", "python"]
    commit-message:
      prefix: "deps(py)"

  # Docker base images
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      timezone: "America/Chicago"
    cooldown:
      default-days: 7
    labels: ["dependencies", "docker"]
    commit-message:
      prefix: "deps(docker)"

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      timezone: "America/Chicago"
    cooldown:
      default-days: 7
    groups:
      actions-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    labels: ["dependencies", "ci"]
    commit-message:
      prefix: "ci"
