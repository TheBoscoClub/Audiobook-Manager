---
name: Security Checks

"on":
  pull_request:
    branches: [main, master]
  push:
    branches: [main, master]

# Read-only scanning — superseded runs carry no value, cancel them.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: >-
          actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        # v7.0.1
        with:
          fetch-depth: 0  # Full history for better analysis

      - name: Determine diff range
        id: diff-range
        env:
          # SHAs are passed via env — never interpolated into the script
          # body — per workflow-injection hygiene.
          EVENT_NAME: ${{ github.event_name }}
          PUSH_BASE: ${{ github.event.before }}
          PUSH_HEAD: ${{ github.event.after }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          # Compute the commit range the diff-based scans must cover, so a
          # multi-commit push is scanned in full instead of tip-only.
          ZEROS="0000000000000000000000000000000000000000"
          if [ "$EVENT_NAME" = "pull_request" ]; then
            # Merge-base (three-dot) diff: exactly what the PR introduces.
            RANGE="${PR_BASE}...${PR_HEAD}"
          elif [ "$PUSH_BASE" = "$ZEROS" ] || \
               ! git cat-file -e "${PUSH_BASE}^{commit}" 2>/dev/null; then
            # Initial push of a branch, or a force-push whose old tip no
            # longer exists: no valid base — scan the full tree at the
            # pushed commit by diffing against the empty tree.
            EMPTY_TREE=$(git hash-object -t tree /dev/null)
            RANGE="${EMPTY_TREE}..${PUSH_HEAD:-HEAD}"
          else
            # Normal push: every commit in the push, not just the tip.
            RANGE="${PUSH_BASE}..${PUSH_HEAD}"
          fi
          echo "Diff range: $RANGE"
          echo "range=$RANGE" >> "$GITHUB_OUTPUT"

      - name: Check for hardcoded credentials
        env:
          DIFF_RANGE: ${{ steps.diff-range.outputs.range }}
        run: |
          echo "Checking for hardcoded credentials..."
          # Check for potential API keys, passwords, tokens across the full
          # push/PR range computed by the "Determine diff range" step.
          #
          # .beads/ is excluded: it is bd's generated issue export, and issue prose
          # legitimately discusses credentials by name ("rotate the purge token",
          # DKIM p= fragments, Cloudflare record IDs). Scanning it produces false
          # positives on every issue that mentions a token. Real credentials are
          # prohibited there by policy — see ~/.claude/rules/beads.md "bd remember
          # — Sensitive Data Policy".
          PATTERN='(api.?key|password|token|secret).*=.*["'"'"'][a-zA-Z0-9]{16,}["'"'"']'
          # Diff to a file first so a git failure fails the step instead of
          # being swallowed by an empty pipe into grep.
          #
          # ADDED lines only (`git diff` emits both `+added` and `-removed`).
          # Scanning removed lines would make it impossible to ever delete a
          # previously-committed secret: the removal shows the string in the
          # diff and the scan would fail forever. We flag what a push INTRODUCES,
          # not what it takes away. The `^+` filter excludes the `+++ b/file`
          # header line via the second grep.
          git diff "$DIFF_RANGE" -- . ':(exclude).beads/' \
            | grep -E '^\+' | grep -vE '^\+\+\+' \
            > "$RUNNER_TEMP/credential-scan.diff" || true
          if grep -iE "$PATTERN" "$RUNNER_TEMP/credential-scan.diff"; then
            echo "ERROR: Potential hardcoded credential detected"
            exit 1
          fi
          echo "No hardcoded credentials found"

      - name: Verify .gitignore integrity
        run: |
          echo "Verifying .gitignore protects sensitive files..."

          # Critical patterns that should be in .gitignore
          REQUIRED_IGNORES=(
            ".env"
            "*.key"
            "*.log"
          )

          for pattern in "${REQUIRED_IGNORES[@]}"; do
            if ! grep -q "$pattern" .gitignore 2>/dev/null; then
              echo "WARNING: .gitignore missing pattern: $pattern"
            fi
          done

          echo ".gitignore check complete"

      - name: Check for sensitive files committed
        run: |
          echo "Scanning for accidentally committed sensitive files..."

          # Check for common sensitive file patterns
          if git ls-files | grep -iE '\.(key|pem|cert|env)$' \
              | grep -v '.env.example'; then
            echo "ERROR: Sensitive files committed to repository"
            exit 1
          fi

          echo "No sensitive files found in repository"

      - name: Check for dangerous logging
        env:
          DIFF_RANGE: ${{ steps.diff-range.outputs.range }}
        run: |
          echo "Checking for dangerous logging patterns..."

          # Check for logging credentials across the same push/PR range
          LOG_PATTERN='(print|echo|console\.log|logger).*\$?(API_KEY|PASSWORD|TOKEN|SECRET)'
          # ADDED lines only — same reasoning as the credential scan above:
          # removing a dangerous log line must not fail the check.
          git diff "$DIFF_RANGE" \
            | grep -E '^\+' | grep -vE '^\+\+\+' \
            > "$RUNNER_TEMP/logging-scan.diff" || true
          if grep -iE "$LOG_PATTERN" "$RUNNER_TEMP/logging-scan.diff"; then
            echo "WARNING: Code may log sensitive data"
          fi

          echo "Logging check complete"

      - name: Check JavaScript for dangerous patterns
        run: |
          echo "Checking JavaScript for dangerous patterns..."

          # Check for eval() usage (potential code injection)
          if grep -rn "eval\s*(" --include="*.js" library/ \
              2>/dev/null | grep -v "node_modules"; then
            echo "WARNING: eval() usage detected - code injection risk"
          fi

          # Check for document.write() (XSS risk)
          if grep -rn "document\.write\s*(" --include="*.js" \
              library/ 2>/dev/null; then
            echo "WARNING: document.write() usage - XSS risk"
          fi

          # Check for innerHTML without escaping
          if grep -rn "\.innerHTML\s*=\s*[^'\"<]" --include="*.js" \
              library/ 2>/dev/null | grep -v "escapeHtml"; then
            echo "WARNING: Potential unescaped innerHTML assignment"
          fi

          # Check for Function constructor (similar to eval)
          if grep -rn "new\s*Function\s*(" --include="*.js" \
              library/ 2>/dev/null; then
            echo "WARNING: Function constructor usage - similar to eval()"
          fi

          echo "JavaScript security check complete"

      - name: Check shell scripts for dangerous patterns
        run: |
          echo "Checking shell scripts for dangerous patterns..."

          # Check for eval in shell scripts
          if grep -rn "^\s*eval\s" --include="*.sh" . \
              2>/dev/null | grep -v ".git"; then
            echo "WARNING: eval usage in shell scripts detected"
          fi

          # Check for curl | bash pattern (remote code execution)
          CURL_PATTERN='curl.*|.*bash|wget.*|.*sh'
          if grep -rn "$CURL_PATTERN" --include="*.sh" . \
              2>/dev/null | grep -v ".git"; then
            echo "WARNING: Potential remote code execution pattern"
          fi

          echo "Shell script security check complete"

      - name: Set up Python
        uses: >-
          actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.14'

      - name: Check Python dependency vulnerabilities
        run: |
          echo "Checking Python dependencies for known vulnerabilities..."
          pip install pip-audit -q

          # Check if requirements.txt exists and audit it
          if [ -f "library/requirements.txt" ]; then
            echo "Auditing library/requirements.txt..."
            pip-audit -r library/requirements.txt --desc on || {
              echo "ERROR: Vulnerable dependencies found"
              exit 1
            }
          fi

          echo "No known vulnerabilities in Python dependencies"

      - name: Security scan summary
        if: always()
        env:
          REPO: ${{ github.repository }}
          REF_NAME: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
        run: |
          echo "=========================================="
          echo "Security Scan Complete"
          echo "=========================================="
          echo "Repository: $REPO"
          echo "Branch: $REF_NAME"
          echo "Commit: $SHA"
          echo "=========================================="
