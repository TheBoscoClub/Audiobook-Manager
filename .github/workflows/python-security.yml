---
name: "Python Security & Quality"

"on":
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  schedule:
    - cron: '0 6 * * 1'  # Weekly on Monday at 6 AM UTC

# Lint/type/security analysis only — nothing is published, so superseding is safe.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ruff:
    name: Ruff Linting
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: >-
          actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        # v7.0.1
      - name: Run Ruff
        uses: >-
          astral-sh/ruff-action@278981a28ce3188b1e39527901f38254bf3aac89
        # v4.1.0
        with:
          args: "check --output-format=github"
          # Pin ruff to the same version developers run. Without this the action
          # installs whatever is newest, so a ruff release can turn main red with
          # no change to this repo — which is exactly what happened on
          # 2026-07-27 when 0.16.0 shipped. Reading the version from
          # requirements-dev.txt keeps CI and dev on one source of truth and
          # lets Dependabot move both together.
          version-file: "library/requirements-dev.txt"

  mypy:
    name: Type Checking
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: >-
          actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        # v7.0.1
      - name: Set up Python
        uses: >-
          actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        # v7.0.0
        with:
          python-version: '3.14'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f library/requirements.txt ]; then
            pip install -r library/requirements.txt
          fi
          # requirements-dev.txt, not a bare `pip install mypy`. It carries the
          # mypy floor (>=2.3.0) and the types-* stubs, so CI type-checks with
          # the same versions developers do instead of whatever is newest.
          #
          # It also installs pytest, which the type environment genuinely needs:
          # without it, `--ignore-missing-imports` makes `pytest` resolve to Any,
          # so `pytest.skip()` is typed as returning Any rather than NoReturn.
          # Mypy then thinks flow continues past a `if x is None: pytest.skip()`
          # guard and reports phantom "str | None" errors in test modules that
          # are correct as written.
          pip install -r library/requirements-dev.txt

      # A real gate. This previously swallowed failures twice over — `|| echo
      # ::warning::` masked the exit code, and continue-on-error masked what was
      # left — so the job could not fail no matter what mypy found. It also ran
      # with no config at all (mypy.ini and pyproject.toml were both gitignored).
      # Config now lives in the tracked pyproject.toml and the tree checks clean:
      # "Success: no issues found in 394 source files".
      - name: Run mypy
        run: mypy . --ignore-missing-imports

  bandit:
    name: Security Scan (Bandit)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: >-
          actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        # v7.0.1
      - name: Set up Python
        uses: >-
          actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        # v7.0.0
        with:
          python-version: '3.14'

      - name: Install Bandit
        run: pip install bandit[toml]

      # Two runs, different jobs to do. The artifact run records EVERY finding
      # (all severities) for review; it may exit non-zero and that's fine. The
      # gate run fails the job on MEDIUM+ (-ll). Both read the tracked .bandit
      # config (-c) — the audited skip list. Before 2026-08-05 this step was
      # masked by `|| true` + continue-on-error AND ran without the config
      # (.bandit was gitignored), so the green check certified nothing.
      - name: Bandit report (all severities, artifact only)
        run: |
          bandit -r . -c .bandit \
            -f json -o bandit-report.json || true

      - name: Bandit gate (fails on MEDIUM+)
        run: bandit -r . -c .bandit -ll -f txt

      - name: Upload Bandit Report
        uses: >-
          actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        # v7.0.1
        if: always()
        with:
          name: bandit-security-report
          path: bandit-report.json

  pip-audit:
    name: Dependency Vulnerabilities
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: >-
          actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        # v7.0.1
      - name: Set up Python
        uses: >-
          actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        # v7.0.0
        with:
          python-version: '3.14'

      - name: Install pip-audit
        run: pip install pip-audit

      # Ungated 2026-08-05: the `|| echo ::warning` + continue-on-error pair
      # meant this job could never fail, and it scanned only requirements.txt.
      # Now audits all three requirement files and a finding fails the job.
      - name: Run pip-audit
        run: |
          pip-audit -r library/requirements.txt --desc
          pip-audit -r library/requirements-dev.txt --desc
          pip-audit -r library/requirements-docker.txt --desc
