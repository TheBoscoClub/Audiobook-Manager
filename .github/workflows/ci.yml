---
name: CI

"on":
  pull_request:
    branches: [main, master]
  push:
    branches: [main, master]

# Supersede in-flight runs for the same ref — the newest push is the one that
# should report. Safe here: no job publishes or mutates anything.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-tests:
    name: Python Tests (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    permissions:
      contents: read

    strategy:
      # Prove every version the docs claim, independently — one failing
      # interpreter must not mask the result of the others.
      fail-fast: false
      matrix:
        # Keep in sync with the "Python 3.12+" claim in README.md,
        # docs/ARCHITECTURE.md and docs/MULTI-LANGUAGE-SETUP.md.
        # 3.12 = Ubuntu 24.04 LTS, 3.13 = Debian 13, 3.14 = Fedora/CachyOS
        # and the Dockerfile base image.
        python-version: ['3.12', '3.13', '3.14']

    steps:
      - name: Checkout code
        uses: >-
          actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        # v7.0.1

      - name: Set up Python
        uses: >-
          actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      # Restore the .deb archives from GitHub's own CDN rather than re-fetching
      # them from azure.archive.ubuntu.com every run. On 2026-08-03 that mirror
      # degraded to 34.4 kB/s and a single leg spent 46m16s here, turning a
      # ~4 minute job into 50m32s (run 30840385336). The three matrix legs share
      # one cache entry — the package set does not vary by Python version.
      - name: Cache apt archives
        uses: >-
          actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        # v6.1.0
        with:
          path: ~/apt-cache
          key: >-
            apt-${{ runner.os }}-${{ runner.arch }}-${{
            hashFiles('.github/apt-packages.txt') }}
          restore-keys: |
            apt-${{ runner.os }}-${{ runner.arch }}-

      - name: Install system dependencies
        # Package list lives in .github/apt-packages.txt so it cannot drift from
        # the cache key above. A stale cache is safe rather than wrong: apt keys
        # archives on name_version_arch.deb, so a version bump simply misses and
        # re-downloads.
        run: |
          mkdir -p ~/apt-cache/partial
          # Read into an array so the split into separate apt arguments is
          # explicit rather than relying on unquoted word splitting.
          mapfile -t packages < <(grep -vE '^[[:space:]]*(#|$)' .github/apt-packages.txt)
          echo "Installing: ${packages[*]}"
          sudo apt-get update -qq
          sudo apt-get \
            -o Dir::Cache::archives="$HOME/apt-cache" \
            -o APT::Keep-Downloaded-Packages=true \
            install -y --no-install-recommends "${packages[@]}"
          # actions/cache runs as the runner user and cannot read root-owned debs
          sudo chown -R "$USER" ~/apt-cache

      - name: Install dependencies
        run: |
          cd library
          python -m pip install --upgrade pip
          pip install pytest pytest-cov
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi
          if [ -f requirements-dev.txt ]; then
            pip install -r requirements-dev.txt
          fi

      - name: Run pytest with coverage
        run: |
          cd library
          pytest tests/ -v --tb=short --cov=. \
            --cov-config=../.coveragerc.ci --cov-report=xml

      - name: Upload coverage to Codecov
        # Single upload per commit — the matrix runs the same suite three
        # times, and three uploads would just fight over the same report.
        if: ${{ !cancelled() && matrix.python-version == '3.14' }}
        uses: >-
          codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f
        # v7.0.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: library/coverage.xml
          flags: unittests
          name: audiobook-manager
          fail_ci_if_error: ${{ secrets.CODECOV_TOKEN != '' }}

  docker-build:
    name: Docker Build Check
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: >-
          actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        # v7.0.1

      - name: Set up Docker Buildx
        uses: >-
          docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e
        # v4.3.0

      - name: Validate Dockerfile
        run: |
          docker buildx build --check -f Dockerfile .
          echo "Dockerfile is valid"

      - name: Build Docker image (no push)
        run: |
          docker buildx build --load -t audiobooks:test -f Dockerfile .
          echo "Docker image builds successfully"

  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: >-
          actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        # v7.0.1

      - name: Run ShellCheck
        uses: >-
          ludeeus/action-shellcheck@00cae500b08a931fb5698e11e79bfbd38e612a38
        # v2.0.0
        with:
          severity: error
          scandir: '.'
          format: gcc
        env:
          SHELLCHECK_OPTS: '-e SC1091'

  yaml-lint:
    name: YAML Validation
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: >-
          actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        # v7.0.1

      - name: Validate docker-compose.yml
        run: |
          python3 -c "import yaml; yaml.safe_load(open('docker-compose.yml'))"
          echo "docker-compose.yml is valid YAML"

      - name: Validate GitHub Actions workflows
        run: |
          for f in .github/workflows/*.yml; do
            python3 -c "import yaml; yaml.safe_load(open('$f'))"
            echo "$f is valid YAML"
          done

  eslint:
    name: ESLint (web-v2)
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: >-
          actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        # v7.0.1

      - name: Set up Node
        uses: >-
          actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        # v7.0.0
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: library/web-v2/package-lock.json

      - name: Install dependencies
        run: |
          cd library/web-v2
          npm ci --no-audit --no-fund

      - name: Run ESLint
        run: |
          cd library/web-v2
          npx eslint --config eslint.config.js js/
