# Audiobooks reverse-proxy front door (two sites).
#
# Cloudflare tunnel ingress routes (replace <domain> with your own):
#   <env>lib.<domain>    -> this host :8084  (NATIVE app, matches production)
#   <env>docker.<domain> -> this host :8085  (DOCKER app, explicit opt-in)
#
# install.sh / upgrade.sh substitute __CADDY_DIR__ (AUDIOBOOKS_CADDY_DIR, default
# /etc/caddy), __NATIVE_PORT__ and __DOCKER_PORT__ with
# AUDIOBOOKS_WEB_PORT (default 8090) and AUDIOBOOKS_DOCKER_PORT (default 8443).
#
# handle_errors 502/503 serves a friendly page when the upstream is down, so
# `<env>docker` on a native-only VM (or vice-versa) never shows a raw error:
#   - an upgrade is running (upgrade-helper-process mirrors upgrade-status.json
#     here): maintenance.html, which polls that file to draw live progress;
#   - any other outage: unavailable.html ("Be Right Back"), falling back to
#     maintenance.html on installs that predate unavailable.html.
# The pages keep the upstream's 502/503 so caches and crawlers see the outage;
# only upgrade-status.json is answered 200 — maintenance.html reads it with
# `r.ok`, so a 502 there left the progress panel blank (Audiobook-Manager-cxm).

(audiobook_error_pages) {
	handle_errors 502 503 {
		@statusJson path /upgrade-status.json
		handle @statusJson {
			header Content-Type application/json
			header Access-Control-Allow-Origin *
			file_server {
				root __CADDY_DIR__
				status 200
			}
		}
		@upgrading file {
			root __CADDY_DIR__
			try_files /upgrade-status.json
		}
		handle @upgrading {
			rewrite * /maintenance.html
			file_server {
				root __CADDY_DIR__
			}
		}
		handle {
			root * __CADDY_DIR__
			try_files /unavailable.html /maintenance.html
			file_server
		}
	}
}

:8084 {
	reverse_proxy https://localhost:__NATIVE_PORT__ {
		transport http {
			tls_insecure_skip_verify
		}
	}

	import audiobook_error_pages
}

:8085 {
	reverse_proxy https://localhost:__DOCKER_PORT__ {
		transport http {
			tls_insecure_skip_verify
		}
	}

	import audiobook_error_pages
}
