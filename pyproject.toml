# Canonical formatter AND import sorter: ruff (CI-enforced).
#
# Rationale for ruff-only:
#
# Ruff formatter and Black disagree on line-wrapping when trailing comments
# (`# nosec`, `# nosemgrep`, `# noqa`, etc.) push a line past the line-length
# limit. Ruff excludes trailing pragma/suppression comments from line-length
# measurement (by design — to keep security suppressions on the same line
# as the code they annotate); Black includes them. No combination of
# options (`skip-magic-trailing-comma`, `line-length`, `preview`) makes
# them agree when those comments are present.
#
# Worse, Black 26.3.1 has been observed removing trailing security
# suppression comments (`# nosec B608  # nosemgrep: ...`) when a wrapping
# rule applies — silently stripping the annotation that prevents bandit/
# semgrep false positives from being counted as real vulnerabilities.
# This is unsafe for a project that relies on `# nosec`/`# nosemgrep`
# annotations as part of its security scanning baseline.
#
# Decision:
# - `ruff format` is the authoritative formatter. It is checked by the
#   project's /test audit phase 7 AND enforced in CI: the "Ruff Linting"
#   job in python-security.yml runs `ruff format --check` alongside
#   `ruff check` (gate added 2026-08-05, bd Audiobook-Manager-3ed, after
#   reformatting the drifted files). Ruff 0.16+ also formats Python code
#   blocks embedded in Markdown, so docs are covered by the same gate.
# - `ruff check` handles lint (including import sorting via the `I` rules);
#   `ruff format` handles formatting. Both use `line-length = 100`.
# - Black and isort are deliberately NOT installed and NOT configured here.
#   A config block for an unenforced formatter is worse than none: it reads
#   as project policy while CI runs something else, and running it would
#   have reformatted 134 files straight through the `ruff format --check`
#   gate. Both tools were removed from library/requirements-dev.txt for the
#   same reason (Single Canonical Source).
#
# If a future Black release fixes the trailing-comment handling AND the
# comment-deletion bug, re-evaluate adding `black --check` to CI.

[tool.ruff]
line-length = 100
target-version = "py314"
extend-exclude = [
    "venv",
    ".snapshots",
    ".btrbk-snapshots",
    "library/certs",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.ruff.lint]
# E/F/W match the ruff-action defaults used by CI. `I` (isort) is the
# canonical import-sorting rule set — it replaced the dead `[tool.isort]`
# block, which configured a tool no workflow, script or audit phase ever
# invoked, so import order had gone unchecked everywhere.
select = ["E", "F", "W", "I"]
ignore = [
    # E501 (line too long) is handled by `ruff format`; do not double-report.
    "E501",
]

[tool.ruff.lint.per-file-ignores]
# Test files: assert statements are the idiomatic pytest assertion mechanism.
# S104 bind-all-interfaces: tests bind to ephemeral localhost sockets in controlled
#   environments — no production exposure.
# S105/S106 hardcoded-password: test credentials are synthetic, never used in prod.
# S108 /tmp paths: tests use temp dirs for isolation; cleaned up by pytest/tmpdir.
# S110/S112 try/except/pass: tests intentionally suppress cleanup errors in teardown.
# S112 try/except/continue: same teardown-cleanup pattern.
# S310 urllib scheme check: tests call known-localhost or mocked URLs.
# S603/S607 subprocess: tests invoke real install.sh/upgrade.sh/bash scripts;
#   full paths are not possible because paths differ across dev/test/CI environments.
# S608 SQL string: tests use controlled fixture DBs, no user-controlled input.
"library/tests/**" = ["S101", "S104", "S105", "S106", "S108", "S110", "S112", "S310", "S603", "S607", "S608"]

[tool.mypy]
# Canonical mypy config. This was previously split across a gitignored mypy.ini
# (which mypy ranks ABOVE pyproject.toml, so it silently won locally) and this
# block (which CI never saw, because pyproject.toml was gitignored too). The two
# disagreed, so `check_untyped_defs = true` below had never actually run
# anywhere. Merged here as the single source; mypy.ini is gone.
python_version = "3.14"
ignore_missing_imports = true
namespace_packages = false
exclude = ["venv/", ".snapshots/", ".worktrees/", ".git/"]
# check_untyped_defs is ON repo-wide (Audiobook-Manager-7bx, enabled 2026-08-05
# after clearing the 78 errors it surfaced — mostly real annotation fixes, plus
# a handful of precise `# type: ignore[code]` comments on test monkeypatch
# patterns). The Type Checking CI job is blocking; keep this flag true and fix
# new errors rather than turning it back off.
check_untyped_defs = true

[[tool.mypy.overrides]]
# The project ships its own `websocket` module, which shadows the third-party
# package of the same name; mypy resolves the import to the wrong one.
module = ["websocket", "websocket.*"]
ignore_errors = true

[tool.pylint.typecheck]
# sqlcipher3 is a C extension. Pylint cannot introspect its exports statically,
# so it flags false positives for the `connect` and `DatabaseError` members
# (both of which exist at runtime — verified via `hasattr(sqlcipher3, ...)`).
generated-members = ["sqlcipher3.connect", "sqlcipher3.DatabaseError"]
# WHAT THIS OPTION ACTUALLY DOES
# ------------------------------
# `ignored-modules` belongs to pylint's *typecheck* checker: it suppresses
# **no-member (E1101)** for attributes accessed on the listed modules. It does
# NOT suppress import-error (E0401) — the comment here previously read
# "Modules pylint cannot resolve statically", which describes import
# resolution and is the wrong mechanism. An unresolvable import is silenced by
# fixing sys.path / an `# pylint: disable=import-error`, never by this list.
#
# WHY THE ENTRIES STAY
# --------------------
# Kept as-is rather than pruned. Pylint is NOT CI-gated in this project (no
# workflow invokes it; ruff + mypy are the gates), so an entry that turns out
# to be inert costs nothing, while removing one that IS doing work would
# reintroduce E1101 noise in the next ad-hoc `pylint` run with no test to
# catch it. Accuracy of the description is the fix here, not curation of the
# list. The two categories present:
#
#   Genuinely dynamic at runtime — no-member is a real false positive:
#     sqlcipher3 (C extension), torch / whisper (GPU-only, imported lazily in
#     whisper_gpu_service.py), fido2.* (optional WebAuthn dep), gevent,
#     mutagen.
#
#   Resolved via sys.path manipulation before import (conftest or a script
#   bootstrap), so pylint analyses them without their package context and
#   infers members incompletely:
#     library.localization.*, api_modular, conftest, database, models,
#     name_parser, i18n, operation_status, add_new_audiobooks, proxy_server,
#     utils.openlibrary_client.
ignored-modules = [
    "sqlcipher3",
    "torch",
    "whisper",
    "fido2",
    "fido2.hid",
    "fido2.client",
    "fido2.ctap",
    "fido2.webauthn",
    "gevent",
    "gevent.pywsgi",
    "mutagen",
    "library.localization",
    "library.localization.selection",
    "library.localization.pipeline",
    "library.localization.stt",
    "library.localization.stt.base",
    "library.localization.tts",
    "library.localization.tts.factory",
    "library.localization.tts.edge_tts_provider",
    "library.localization.tts.vastai_xtts",
    "api_modular",
    "api_modular.auth",
    "conftest",
    "database",
    "models",
    "name_parser",
    "i18n",
    "operation_status",
    "add_new_audiobooks",
    "proxy_server",
    "utils.openlibrary_client",
]
