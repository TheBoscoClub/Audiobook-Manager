[mutmut]
source_paths=localization/translation
only_mutate=localization/translation/quota.py
also_copy=
    tests
    config.py
    common_utils
    localization
pytest_add_cli_args=
    tests/test_quota_reconcile.py

# Mutation testing (Audiobook-Manager mutation-testing policy).
#
# Run from THIS directory, not the project root:
#     cd library && ../venv/bin/mutmut run --max-children 8
#     ../venv/bin/mutmut results
#
# It must run from library/ because conftest.py injects this directory into
# sys.path, so tests import `localization.…` while a project-root run would
# make mutmut look for `library.localization.…` and abort with a key mismatch.
#
# Only [mutmut] lives here — pytest reads pytest.ini at the project root and
# ruff reads pyproject.toml, so this file does not affect either.
